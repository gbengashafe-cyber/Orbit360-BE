paths:
  /api/v1/leaves:
    post:
      tags:
        - Leave Management
      summary: Create leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeId
                - startDate
                - endDate
                - type
              properties:
                employeeId:
                  type: integer
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                type:
                  type: string
                  enum: [sick, vacation, personal, maternity, paternity]
                reason:
                  type: string
      responses:
        201:
          description: Leave request created successfully
        400:
          description: Bad request
    get:
      tags:
        - Leave Management
      summary: Get all leave requests (HR Only)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: rows
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: List of leave requests
        403:
          description: Forbidden

  /api/v1/leaves/employee/{employeeId}:
    get:
      tags:
        - Leave Management
      summary: Get leaves by employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Employee leave requests

  /api/v1/leaves/types:
    get:
      tags:
        - Leave Management
      summary: Get all leave types
      responses:
        200:
          description: List of leave types

  /api/v1/leaves/balance/{employeeId}:
    get:
      tags:
        - Leave Management
      summary: Get employee leave balance
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
        - in: query
          name: year
          schema:
            type: integer
      responses:
        200:
          description: Employee leave balance

  /api/v1/leaves/{id}:
    get:
      tags:
        - Leave Management
      summary: Get leave by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Leave details
        404:
          description: Leave not found
    delete:
      tags:
        - Leave Management
      summary: Cancel leave request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Leave cancelled

  /api/v1/leaves/{id}/status:
    patch:
      tags:
        - Leave Management
      summary: Approve or decline leave (HR Only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approved, rejected]
      responses:
        200:
          description: Leave status updated
        403:
          description: Forbidden
