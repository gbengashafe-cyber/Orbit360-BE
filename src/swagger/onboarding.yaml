paths:
  /api/v1/onboardings:
    post:
      tags:
        - Onboarding (Documents)
      summary: Create onboarding document (HR Only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeId
                - documentType
                - documentName
              properties:
                employeeId:
                  type: integer
                documentType:
                  type: string
                documentName:
                  type: string
                documentUrl:
                  type: string
                  format: uri
                notes:
                  type: string
      responses:
        201:
          description: Document created successfully
    get:
      tags:
        - Onboarding (Documents)
      summary: Get all onboarding documents (HR Only)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: rows
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: List of onboarding documents

  /api/v1/onboardings/employee/{employeeId}:
    get:
      tags:
        - Onboarding (Documents)
      summary: Get onboarding documents by employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Employee onboarding documents

  /api/v1/onboardings/{id}:
    get:
      tags:
        - Onboarding (Documents)
      summary: Get onboarding document by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Document details
        404:
          description: Document not found
    patch:
      tags:
        - Onboarding (Documents)
      summary: Update onboarding document status (HR Only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, submitted, approved, rejected]
                documentUrl:
                  type: string
                  format: uri
                notes:
                  type: string
      responses:
        200:
          description: Document updated successfully
