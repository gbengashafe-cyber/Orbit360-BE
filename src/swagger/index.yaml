  # HR DOCUMENTS  (/api/v1/hr-documents/...)
  # ═══════════════════════════════════════════════════════════════════════════
  /hr-documents/initialize:
    post:
      tags: [HR Documents]
      summary: Initialize default document folders
      description: Requires MANAGE_DOCUMENTS permission.
      responses:
        '200':
          description: Default folders initialized

  /hr-documents/documents:
    get:
      tags: [HR Documents]
      summary: List documents (filtered by access level)
      responses:
        '200':
          description: List of documents
    post:
      tags: [HR Documents]
      summary: Upload a document
      description: Requires MANAGE_DOCUMENTS permission. Supports multipart uploads.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  type: integer
                title:
                  type: string
                access_level:
                  type: string
      responses:
        '201':
          description: Document created

  /hr-documents/documents/{id}:
    get:
      tags: [HR Documents]
      summary: Get document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Document record
    put:
      tags: [HR Documents]
      summary: Update document metadata
      description: Requires MANAGE_DOCUMENTS permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      tags: [HR Documents]
      summary: Request document deletion
      description: Requires MANAGE_DOCUMENTS permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deletion requested

  /hr-documents/folders:
    get:
      tags: [HR Documents]
      summary: List document folders
      responses:
        '200':
          description: List of folders
    post:
      tags: [HR Documents]
      summary: Create a folder
      description: Requires MANAGE_DOCUMENTS permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                parentId:
                  type: integer
      responses:
        '201':
          description: Folder created

  /hr-documents/folders/{id}:
    get:
      tags: [HR Documents]
      summary: Get folder by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Folder record
    put:
      tags: [HR Documents]
      summary: Update folder
      description: Requires MANAGE_DOCUMENTS permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      tags: [HR Documents]
      summary: Delete folder
      description: Requires MANAGE_DOCUMENTS permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted

  /hr-documents/deletion-requests/pending:
    get:
      tags: [HR Documents]
      summary: Get pending deletion requests
      description: Requires APPROVE_DOCUMENT_DELETION permission.
      responses:
        '200':
          description: Pending deletion requests

  /hr-documents/deletion-requests/{id}/approve:
    post:
      tags: [HR Documents]
      summary: Approve a document deletion request
      description: Requires APPROVE_DOCUMENT_DELETION permission.
      parameters:
        - name: id
          in: path
          required: true
