  # ═══════════════════════════════════════════════════════════════════════════
  # TRAINING REQUESTS  (/api/v1/training-requests/...)
  # ═══════════════════════════════════════════════════════════════════════════
  /training-requests:
    get:
      tags: [Training Requests]
      summary: Get training requests
      description: Employees see own requests; HR sees all. Requires LIST_TRAINING_REQUESTS permission.
      responses:
        '200':
          description: List of training requests
    post:
      tags: [Training Requests]
      summary: Submit a training request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trainingTitle:
                  type: string
                provider:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                cost:
                  type: number
                justification:
                  type: string
      responses:
        '201':
          description: Training request submitted

  /training-requests/{id}:
    get:
      tags: [Training Requests]
      summary: Get training request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Training request record
    delete:
      tags: [Training Requests]
      summary: Delete training request (only if pending)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted

  /training-requests/{id}/supervisor-approval:
    put:
      tags: [Training Requests]
      summary: Supervisor approves or rejects training request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingApprovalRequest'
      responses:
        '200':
          description: Supervisor decision recorded

  /training-requests/{id}/hr-review:
    put:
      tags: [Training Requests]
      summary: HR officer reviews training request
      description: Requires MANAGE_TRAINING_REQUESTS permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingApprovalRequest'
      responses:
        '200':
          description: HR review recorded

  /training-requests/{id}/final-approval:
    put:
      tags: [Training Requests]
      summary: HR manager gives final approval/rejection
      description: Requires APPROVE_TRAINING_REQUESTS permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingApprovalRequest'
      responses:
        '200':
          description: Final decision recorded

