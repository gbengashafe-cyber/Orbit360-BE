openapi: 3.0.3
info:
  title: Orbit360 HR Platform API
  description: |
    REST API for the Orbit360 Human Resources Management Platform.
    Covers authentication, employee management, payroll, leave, loans, recruitment,
    performance, onboarding, exits, complaints, training, and more.

    ## Authentication
    Most endpoints require a Bearer JWT access token obtained from `/api/auth/login` or `/api/auth/user`.
    Refresh tokens are managed via HTTP-only cookies.
  version: 1.0.0
  contact:
    name: Orbit360 API Support

servers:
  - url: /api
    description: Auth routes (v0)
  - url: /api/v1
    description: Core API (v1)

tags:
  - name: Auth
    description: Authentication and session management
  - name: Employees
    description: Employee records and HR operations
  - name: Companies
    description: Company / SBU management
  - name: Departments
    description: Department management
  - name: Job Roles
    description: Job role management
  - name: Leave
    description: Leave requests and balances
  - name: Payroll
    description: Payroll generation and approval
  - name: Payroll Reports
    description: Payroll Excel report uploads
  - name: Loans
    description: Employee loan requests and approvals
  - name: Loan Types
    description: Loan type configuration
  - name: Recruitment
    description: Job postings and applications
  - name: Performance
    description: Goals and appraisal cycles
  - name: Exit
    description: Employee exit / offboarding
  - name: HR Documents
    description: Document and folder management
  - name: Onboarding
    description: Employee onboarding documents
  - name: Complaints
    description: Workplace complaint management
  - name: Training Requests
    description: Training request lifecycle
  - name: Dashboard
    description: Aggregated statistics
  - name: Pending Authorization
    description: Pending approvals across modules

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object

    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer

    # ─── Auth ───────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LdapLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    GoogleCallbackRequest:
      type: object
      required: [googleId, email, firstName, lastName, role]
      properties:
        googleId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        profileImage:
          type: string
        role:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresAt:
              type: integer

    # ─── Employee ───────────────────────────────────────────────────────────
    CreateEmployeeRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - staffId
        - phone
        - hireDate
        - jobRoleId
        - companyId
        - departmentId
        - dob
        - gender
        - address
        - nhfApplicable
        - annualBasicSalary
        - annualHousingAllowance
        - annualTransportAllowance
        - annualLeaveAllowance
        - annualOtherAllowances
        - annualRentAmount
        - leaveEntitlement
      properties:
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        staffId:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        hireDate:
          type: string
          format: date
        jobRoleId:
          type: integer
        companyId:
          type: integer
        departmentId:
          type: integer
        supervisorId:
          type: integer
          nullable: true
        dob:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F]
        nationality:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 100
        bankName:
          type: string
        bankCode:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string
        nhfApplicable:
          type: boolean
        annualBasicSalary:
          type: number
        annualHousingAllowance:
          type: number
        annualTransportAllowance:
          type: number
        annualLeaveAllowance:
          type: number
        annualOtherAllowances:
          type: number
        annualRentAmount:
          type: number
        beneficiaryName:
          type: string
          nullable: true
        beneficiaryRelationship:
          type: string
          nullable: true
        beneficiaryPhone:
          type: string
          nullable: true
        nokName:
          type: string
          nullable: true
        nokRelationship:
          type: string
          nullable: true
        nokPhone:
          type: string
          nullable: true
        leaveEntitlement:
          type: integer
        shouldCreateUser:
          type: boolean
          default: false

    EmployeeLoanRequest:
      type: object
      required: [loanTypeId, principalAmount, tenureMonths, startDate]
      properties:
        loanTypeId:
          type: integer
        principalAmount:
          type: number
        tenureMonths:
          type: integer
        startDate:
          type: string
          format: date
        employeeNote:
          type: string

    # ─── Company ────────────────────────────────────────────────────────────
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true

    # ─── Leave ──────────────────────────────────────────────────────────────
    CreateLeaveRequest:
      type: object
      required: [employeeId, startDate, endDate, type]
      properties:
        employeeId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        type:
          type: string
          description: Leave type (e.g. ANNUAL, SICK, MATERNITY, etc.)
        reason:
          type: string
          nullable: true
        leave_period:
          type: string
          nullable: true
        selected_supervisor_id:
          type: integer
          nullable: true
        covering_employee_id:
          type: integer
          nullable: true
        handover_notes:
          type: string
          nullable: true
        emergency_contact:
          type: string
          nullable: true
        alternative_email:
          type: string
          format: email
          nullable: true
        supporting_documents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              size:
                type: number
              type:
                type: string
              uploaded_at:
                type: string
          nullable: true
        handover_documents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              size:
                type: number
              type:
                type: string
              uploaded_at:
                type: string
          nullable: true

    ApproveDeclineRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approved, rejected]

    # ─── Payroll ────────────────────────────────────────────────────────────
    GeneratePayrollRequest:
      type: object
      required: [payPeriod, companyId]
      properties:
        payPeriod:
          type: string
          pattern: '^20\d{2}-(0[1-9]|1[0-2])$'
          example: '2025-03'
        companyId:
          type: integer

    UpdatePayrollRequest:
      type: object
      properties:
        baseSalary:
          type: number
        allowances:
          type: number
        deductions:
          type: number

    # ─── Loans ──────────────────────────────────────────────────────────────
    CreateLoanRequest:
      type: object
      required: [employeeId, loanTypeId, principalAmount, interestRate, tenureMonths, startDate]
      properties:
        employeeId:
          type: integer
        loanTypeId:
          type: integer
        principalAmount:
          type: number
        interestRate:
          type: number
          minimum: 0
          maximum: 100
        tenureMonths:
          type: integer
        startDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 1000

    UpdateLoanRequest:
      allOf:
        - $ref: '#/components/schemas/CreateLoanRequest'
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED, DISBURSED, CLOSED]

    LoanReviewRequest:
      type: object
      required: [reviewerDecision, reviewerNote]
      properties:
        reviewerDecision:
          type: string
          enum: [RECOMMEND, REJECT]
        reviewerNote:
          type: string
          maxLength: 300

    LoanApprovalRequest:
      type: object
      properties:
        approverNote:
          type: string
          maxLength: 300

    LoanRejectionRequest:
      type: object
      required: [approverNote]
      properties:
        approverNote:
          type: string
          minLength: 3
          maxLength: 300

    LoanTypeRequest:
      type: object
      required: [name, interestRate, maxTenureMonths]
      properties:
        name:
          type: string
          maxLength: 50
        interestRate:
          type: number
          minimum: 0
        maxTenureMonths:
          type: integer
          minimum: 1

    # ─── Recruitment ────────────────────────────────────────────────────────
    CreateJobPostingRequest:
      type: object
      required: [title, description, department, location, created_by]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 10
        department:
          type: string
        location:
          type: string
        employment_type:
          type: string
          enum: [full_time, part_time, contract, temporary]
        salary_range_min:
          type: number
        salary_range_max:
          type: number
        requirements:
          type: string
        created_by:
          type: string

    CreateJobApplicationRequest:
      type: object
      required: [job_posting_id, applicant_name, applicant_email, applicant_phone]
      properties:
        job_posting_id:
          type: integer
        applicant_name:
          type: string
          minLength: 2
        applicant_email:
          type: string
          format: email
        applicant_phone:
          type: string
          minLength: 7
        resume_url:
          type: string
          format: uri
          nullable: true
        cover_letter:
          type: string
          nullable: true
        salary_expectation:
          type: number
          nullable: true

    UpdateApplicationStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [applied, under_review, interview_scheduled, interviewed, offered, hired, rejected]
        rating:
          type: number
          minimum: 1
          maximum: 5

    ScheduleInterviewRequest:
      type: object
      required: [interview_date]
      properties:
        interview_date:
          type: string
          format: date
        interview_notes:
          type: string

    # ─── Performance ────────────────────────────────────────────────────────
    CreateGoalRequest:
      type: object
      required: [employee_id, title, description, start_date, end_date]
      properties:
        employee_id:
          type: integer
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 10
        target_value:
          type: number
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        assigned_by:
          type: string

    UpdateGoalProgressRequest:
      type: object
      properties:
        current_progress:
          type: number
        completion_percentage:
          type: number
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [not_started, in_progress, completed, failed, on_hold]

    CreateAppraisalCycleRequest:
      type: object
      required: [cycle_name, start_date, end_date, review_deadline]
      properties:
        cycle_name:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        review_deadline:
          type: string
          format: date
        created_by:
          type: string
        department:
          type: string

    SubmitAppraisalRequest:
      type: object
      required: [appraisal_cycle_id, employee_id, manager_id]
      properties:
        appraisal_cycle_id:
          type: integer
        employee_id:
          type: integer
        manager_id:
          type: integer
        performance_summary:
          type: string
        strengths:
          type: string
        areas_for_improvement:
          type: string

    ReviewAppraisalRequest:
      type: object
      required: [overall_rating, goals_achievement]
      properties:
        overall_rating:
          type: number
          minimum: 1
          maximum: 5
        goals_achievement:
          type: number
          minimum: 0
          maximum: 100

    # ─── Exit ───────────────────────────────────────────────────────────────
    CreateExitRequest:
      type: object
      required: [employeeId, resignationDate, lastWorkingDate]
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        employeeEmail:
          type: string
          format: email
        employeeDepartment:
          type: string
        position:
          type: string
        resignationDate:
          type: string
          format: date
        lastWorkingDate:
          type: string
          format: date
        noticePeriod:
          type: integer
        status:
          type: string
          enum: [submitted, under_review, clearance_pending, approved, completed, rejected, withdrawn]
        handoverStatus:
          type: string
          enum: [in_progress, yes, no]
        handoverDetails:
          type: string
        handoverRecipientName:
          type: string
        handoverRecipientContact:
          type: string
        outstandingTasks:
          type: string
        outstandingApprovals:
          type: string
        assetsToReturn:
          type: string
        assetReturnStatus:
          type: string
          enum: [not_applicable, pending_return, returned, not_returned]
        salaryBalanceNotes:
          type: string
        loanDeductionNotes:
          type: string
        leaveEncashmentRequest:
          type: boolean
        pensionProcessingNotes:
          type: string
        overallExperienceRating:
          type: integer
          minimum: 1
          maximum: 5
        positiveExperience:
          type: string
        areasForImprovementOrg:
          type: string
        wouldRecommendOrg:
          type: boolean
        itAdminClearance:
          type: boolean
        supervisorClearance:
          type: boolean
        financeClearance:
          type: boolean
        hrClearance:
          type: boolean

    ReviewExitRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approved, rejected]

    # ─── Complaints ─────────────────────────────────────────────────────────
    CreateComplaintRequest:
      type: object
      required: [employee_id, complaint_type, title, description]
      properties:
        employee_id:
          type: integer
        complaint_type:
          type: string
          enum: [harassment, discrimination, safety, wage_dispute, working_conditions, other]
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 10
        severity:
          type: string
          enum: [low, medium, high, critical]
        reported_to:
          type: string
          nullable: true

    ResolveComplaintRequest:
      type: object
      required: [resolution_notes]
      properties:
        resolution_notes:
          type: string
          minLength: 10
          maxLength: 1000

    # ─── Onboarding ─────────────────────────────────────────────────────────
    CreateOnboardingRequest:
      type: object
      required: [employeeId, documentType, documentName]
      properties:
        employeeId:
          type: integer
        documentType:
          type: string
        documentName:
          type: string
        documentUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateOnboardingRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, submitted, approved, rejected]
        documentUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true

    # ─── Training ───────────────────────────────────────────────────────────
    TrainingApprovalRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        rejectionReason:
          type: string

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # AUTH  (/api/auth/...)
  # ═══════════════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /auth/user:
    post:
      tags: [Auth]
      summary: Login via LDAP / Active Directory
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: AD Authentication failed

  /auth/google/callback:
    post:
      tags: [Auth]
      summary: Google OAuth callback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleCallbackRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get currently authenticated user
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthenticated

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke refresh token
      responses:
        '204':
          description: Logged out successfully

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using HTTP-only cookie
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired refresh token

  # ═══════════════════════════════════════════════════════════════════════════
  # EMPLOYEES  (/api/v1/employees/...)
  # ═══════════════════════════════════════════════════════════════════════════
  /employees:
    get:
      tags: [Employees]
      summary: List all employees (HR)
      description: Requires LIST_EMPLOYEES permission or admin role.
      responses:
        '200':
          description: List of employees
    post:
      tags: [Employees]
      summary: Create employee (initiates approval workflow)
      description: Requires MANAGE_EMPLOYEES permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee creation request submitted

  /employees/me:
    get:
      tags: [Employees]
      summary: Get own employee record
      responses:
        '200':
          description: Employee record for the current user

  /employees/directory:
    get:
      tags: [Employees]
      summary: Get employee directory (HR)
      description: Requires LIST_EMPLOYEES permission or admin role.
      responses:
        '200':
          description: Employee directory

  /employees/loans:
    get:
      tags: [Employees]
      summary: Get own loan records
      responses:
        '200':
          description: Loan records for the current employee
    post:
      tags: [Employees]
      summary: Submit a loan request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeLoanRequest'
      responses:
        '201':
          description: Loan request submitted

  /employees/training-requests:
    get:
      tags: [Employees]
      summary: Get own training requests
      responses:
        '200':
          description: Training requests for the current employee

  /employees/loans/{loanId}:
    put:
      tags: [Employees]
      summary: Update own loan request
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeLoanRequest'
      responses:
        '200':
          description: Loan request updated

  /employees/loans/{loanId}/cancellation:
    patch:
      tags: [Employees]
      summary: Cancel own loan request
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Loan request cancelled

  /employees/{id}:
    get:
      tags: [Employees]
      summary: Get employee by ID (HR)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Employee record
    patch:
      tags: [Employees]
      summary: Update employee (initiates approval workflow)
      description: Requires MANAGE_EMPLOYEES permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '200':
          description: Modification request submitted

  /employees/{id}/payrolls:
    get:
      tags: [Employees]
      summary: Get payroll records for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payroll records

  /employees/maintenance/{id}/approval:
    post:
      tags: [Employees]
      summary: Approve employee creation/modification
      description: Requires APPROVE_EMPLOYEES permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Approved

  /employees/maintenance/{id}/rejection:
    post:
      tags: [Employees]
      summary: Reject employee creation/modification
      description: Requires APPROVE_EMPLOYEES permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rejected

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPANIES  (/api/v1/companies/...)
  # ═══════════════════════════════════════════════════════════════════════════
  /companies:
    get:
      tags: [Companies]
      summary: List all companies
      responses:
        '200':
          description: List of companies
    post:
      tags: [Companies]
      summary: Create a company (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created

  /companies/{id}:
    get:
      tags: [Companies]
      summary: Get company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Company record
    put:
      tags: [Companies]
      summary: Update company (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated
    delete:
      tags: [Companies]
      summary: Delete company (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted

  /companies/{companyId}/departments:
    get:
      tags: [Companies]
      summary: Get departments for a company
      parameters:
